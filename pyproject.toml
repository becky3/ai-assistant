[project]
name = "ai-assistant"
version = "0.1.0"
description = "Slack AI learning assistant with intelligent LLM routing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "slack-bolt>=1.18,<2",
    "openai>=1.12,<2",
    "anthropic>=0.18,<1",
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.1,<3",
    "python-dotenv>=1.0,<2",
    "sqlalchemy>=2.0,<3",
    "aiosqlite>=0.20,<1",
    "feedparser>=6.0,<7",
    "aiohttp>=3.9,<4",
    "pyyaml>=6.0,<7",
    "mcp>=1.0,<2",
    "tzdata>=2024.1",
    "py-common-lib",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv.sources]
py-common-lib = { git = "https://github.com/becky3/py-common-lib" }

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint.per-file-ignores]
# 遅延 import のため
"src/main.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
strict = true
[[tool.mypy.overrides]]
module = ["feedparser", "feedparser.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=8.4.2",
    "pytest-asyncio>=0.26.0",
    "pytest-cov>=5.0",
    "ruff>=0.14.14",
    "shellcheck-py>=0.10",
    "types-pyyaml>=6.0.12.20250915",
]
